version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_mvc_dual
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=clinica_veterinaria  # Actualizado al nombre de tu base de datos
      - DB_USER=app_user
      - DB_PASS=app_password
      - APP_DEBUG=true
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_dual
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica_veterinaria # Nombre de la BD que se creará por defecto
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # <-- AQUÍ SE INICIALIZA LA BD
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: